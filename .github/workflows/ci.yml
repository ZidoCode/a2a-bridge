name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test suite (23 checks)
        shell: bash
        run: |
          set +e
          python3 relay/test_a2a.py
          rc=$?
          echo "test_a2a exit=$rc"
          exit $rc
      - name: Dogfood example (two agents, one task)
        shell: bash
        run: |
          set +e
          python3 examples/two_agents.py
          rc=$?
          echo "two_agents exit=$rc"
          exit $rc
