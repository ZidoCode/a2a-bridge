name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Clean junk files (one-shot)"
        run: |
          set -e
          git config user.name "ZidoCode"
          git config user.email "zidocode@users.noreply.github.com"
          changed=0
          # Remove the mangled workflow file that got committed as a junk path
          for f in .github/workflows/ci.yml*; do
            case "$f" in
              .github/workflows/ci.yml) ;;
              *) rm -f "$f"; git rm -f "$f" 2>/dev/null || true; changed=1;;
            esac
          done
          # Remove duplicate flat files if any remain
          for f in a2a_relay.py test_a2a.py a2a_client.py a2a_hmac.py a2a.sh two_agents.py bridge-animated.svg ci.yml one-shot-push.yml gitignore.txt; do
            if [ -f "$f" ]; then
              # only remove if the canonical version exists
              case "$f" in
                a2a_relay.py)  [ -f relay/a2a_relay.py ]  && { git rm -f "$f"; changed=1; } ;;
                test_a2a.py)   [ -f relay/test_a2a.py ]   && { git rm -f "$f"; changed=1; } ;;
                a2a_client.py) [ -f clients/python/a2a_client.py ] && { git rm -f "$f"; changed=1; } ;;
                a2a_hmac.py)   [ -f clients/python/a2a_hmac.py ] && { git rm -f "$f"; changed=1; } ;;
                a2a.sh)        [ -f clients/shell/a2a.sh ] && { git rm -f "$f"; changed=1; } ;;
                two_agents.py) [ -f examples/two_agents.py ] && { git rm -f "$f"; changed=1; } ;;
                bridge-animated.svg) [ -f assets/bridge-animated.svg ] && { git rm -f "$f"; changed=1; } ;;
                *) git rm -f "$f" 2>/dev/null || true; changed=1;;
              esac
            fi
          done
          if [ "$changed" = "1" ]; then
            git add -A
            git commit -m "chore: remove duplicate flat files" || true
            git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ZidoCode/a2a-bridge.git HEAD:main
            echo "Cleaned up and pushed. Re-run CI to test."
            exit 0
          fi
          echo "Repo is clean"
      - name: "Run test suite"
        run: python relay/test_a2a.py
      - name: "Smoke run dogfood example"
        run: python examples/two_agents.py
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Self-heal: restore canonical layout (one-shot, idempotent)"
        run: |
          set -e
          # If files are flat at root, move them into the canonical tree.
          # Idempotent: only runs if the flat state is detected.
          if [ -f a2a_relay.py ] && [ ! -d relay ]; then
            echo "Detected flat layout — restoring canonical tree"
            mkdir -p relay clients/python clients/shell examples assets .github/workflows
            git config user.name "ZidoCode"
            git config user.email "zidocode@users.noreply.github.com"
            [ -f a2a_relay.py ] && git mv a2a_relay.py relay/
            [ -f test_a2a.py ] && git mv test_a2a.py relay/
            [ -f a2a_client.py ] && git mv a2a_client.py clients/python/
            [ -f a2a_hmac.py ] && git mv a2a_hmac.py clients/python/
            [ -f a2a.sh ] && git mv a2a.sh clients/shell/
            [ -f two_agents.py ] && git mv two_agents.py examples/
            [ -f bridge-animated.svg ] && git mv bridge-animated.svg assets/
            [ -f ci.yml ] && git rm -f ci.yml 2>/dev/null || true
            [ -f one-shot-push.yml ] && git rm -f one-shot-push.yml 2>/dev/null || true
            git add -A
            git commit -m "fix: restore canonical project layout"
            git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ZidoCode/a2a-bridge.git HEAD:main
            echo "Layout restored and pushed. This CI run continues on the old tree; re-run for tests."
            exit 0
          fi
          echo "Canonical layout present — running tests"
      - name: "Run test suite"
        run: python relay/test_a2a.py
      - name: "Smoke run dogfood example"
        run: python examples/two_agents.py
