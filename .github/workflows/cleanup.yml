name: Cleanup workflows

on:
  workflow_dispatch:

permissions:
  contents: write
  workflows: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove every workflow file except ci.yml
        run: |
          python3 - <<'PYEOF'
          import os, subprocess
          d = '.github/workflows'
          for name in sorted(os.listdir(d)):
              if name != 'ci.yml':
                  p = os.path.join(d, name)
                  subprocess.run(['git', 'rm', '-q', '--force', '--ignore-unmatch', p], check=False)
                  if os.path.exists(p):
                      os.remove(p)
                  print('removed', repr(name))
          print('remaining:', sorted(os.listdir(d)))
          PYEOF

      - name: Verify tree
        run: |
          python3 relay/test_a2a.py
          python3 examples/two_agents.py

      - name: Commit and push
        run: |
          git config user.name ZidoCode
          git config user.email zidocode@users.noreply.github.com
          git add -A
          git commit -q -m "chore: remove corrupted workflow artifact and one-shot cleanup workflow"
          git push -q https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
          echo "pushed $(git rev-parse HEAD)"
