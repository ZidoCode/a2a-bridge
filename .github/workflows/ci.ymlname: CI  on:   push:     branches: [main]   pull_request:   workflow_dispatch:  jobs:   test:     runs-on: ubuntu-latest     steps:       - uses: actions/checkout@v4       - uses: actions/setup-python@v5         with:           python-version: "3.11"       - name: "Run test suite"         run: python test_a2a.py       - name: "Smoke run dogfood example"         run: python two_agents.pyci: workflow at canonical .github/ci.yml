name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Run test suite"
        run: python test_a2a.py
      - name: "Smoke run dogfood example"
        run: python two_agents.py
ci: workflow at canonical location
