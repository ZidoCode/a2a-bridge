name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check
        run: python -m compileall -q relay clients examples

      - name: Test suite
        run: python relay/test_a2a.py

      - name: Dogfood example (two agents, one task)
        run: python examples/two_agents.py

      - name: Shell client smoke
        if: matrix.python-version == '3.11'
        shell: bash
        run: |
          set -euo pipefail
          export A2A_SECRET=ci-secret A2A_PORT=8765 A2A_HOST=127.0.0.1
          export A2A_DATA="$RUNNER_TEMP/a2a-ci" A2A_RELAY=http://127.0.0.1:8765
          python relay/a2a_relay.py &
          RELAY_PID=$!
          trap 'kill $RELAY_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            curl -sf -H "X-A2A-Secret: $A2A_SECRET" "$A2A_RELAY/health" >/dev/null && break
            sleep 0.2
          done
          curl -sf -X POST -H "X-A2A-Secret: $A2A_SECRET" -H 'Content-Type: application/json' \
            -d '{"agent":"hermes"}' "$A2A_RELAY/register" >/dev/null
          curl -sf -X POST -H "X-A2A-Secret: $A2A_SECRET" -H 'Content-Type: application/json' \
            -d '{"agent":"zido"}' "$A2A_RELAY/register" >/dev/null
          A2A_AGENT=hermes bash clients/shell/a2a.sh send zido "ci hello" | tee /tmp/send.json
          grep -q '"stored"' /tmp/send.json
          A2A_AGENT=zido bash clients/shell/a2a.sh poll 1 | tee /tmp/poll.json
          grep -q 'ci hello' /tmp/poll.json

      - name: Client errors fail clean (no traceback)
        if: matrix.python-version == '3.11'
        shell: bash
        run: |
          set +e
          export A2A_SECRET=x A2A_AGENT=a A2A_RELAY=http://127.0.0.1:1
          out=$(python clients/python/a2a_client.py send b hi 2>&1); rc=$?
          echo "$out"
          [ "$rc" -eq 1 ] || { echo "expected rc=1, got $rc"; exit 1; }
          case "$out" in *Traceback*) echo "traceback leaked"; exit 1;; esac
