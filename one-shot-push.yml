name: one-shot push
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Fix layout: move flat files into project dirs"
        run: |
          git config user.name "ZidoCode"
          git config user.email "zidocode@users.noreply.github.com"
          git mv a2a.sh clients/shell/
          git mv a2a_client.py clients/python/
          git mv a2a_hmac.py clients/python/
          git mv a2a_relay.py relay/
          git mv test_a2a.py relay/
          git mv bridge-animated.svg assets/
          git mv ci.yml .github/workflows/ci.yml
          git mv one-shot-push.yml .github/workflows/one-shot-push.yml
          git add -A
          git commit -m "fix: restore project directory layout after flat upload"
      - name: "Force-push main"
        run: |
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ZidoCode/a2a-bridge.git HEAD:main
chore: one-shot push workflow adds layout-fix step
