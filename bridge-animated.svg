<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Two agents exchange messages through an a2a-bridge relay">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="900" height="420" rx="16" fill="url(#bg)"/>

  <!-- title -->
  <text x="450" y="40" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace,Menlo,monospace" font-size="14" letter-spacing="2">AGENT TO AGENT, OVER PLAIN HTTP</text>

  <!-- wires -->
  <g stroke="url(#wire)" stroke-width="2" opacity="0.5">
    <line x1="150" y1="170" x2="360" y2="205"/>
    <line x1="150" y1="245" x2="360" y2="215"/>
    <line x1="540" y1="205" x2="750" y2="170"/>
    <line x1="540" y1="215" x2="750" y2="245"/>
  </g>

  <!-- flowing dashes on the wire (packet stream) -->
  <g stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4 14" opacity="0.7">
    <line x1="150" y1="170" x2="360" y2="205">
      <animate attributeName="stroke-dashoffset" from="0" to="-180" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="150" y1="245" x2="360" y2="215">
      <animate attributeName="stroke-dashoffset" from="0" to="180" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="540" y1="205" x2="750" y2="170">
      <animate attributeName="stroke-dashoffset" from="0" to="180" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="540" y1="215" x2="750" y2="245">
      <animate attributeName="stroke-dashoffset" from="0" to="-180" dur="3s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- relay box -->
  <circle cx="450" cy="210" r="120" fill="url(#glow)"/>
  <rect x="355" y="150" width="190" height="120" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="450" y="192" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace,Menlo,monospace" font-size="18" font-weight="bold">a2a-bridge</text>
  <text x="450" y="214" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace,Menlo,monospace" font-size="11">relay · one file · stdlib</text>
  <text x="450" y="236" text-anchor="middle" fill="#64748b" font-family="ui-monospace,Menlo,monospace" font-size="11">HMAC · dedup · dead-letter</text>
  <circle cx="450" cy="252" r="4" fill="#34d399">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- agent A: hermes (left) -->
  <g>
    <rect x="35" y="120" width="130" height="170" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="100" cy="165" r="26" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <text x="100" y="174" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace,Menlo,monospace" font-size="20">⚡</text>
    <text x="100" y="220" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="bold">hermes</text>
    <text x="100" y="240" text-anchor="middle" fill="#64748b" font-family="ui-monospace,Menlo,monospace" font-size="10">telegram bot · vm-a</text>
    <rect x="55" y="252" width="90" height="22" rx="11" fill="#0b1020" stroke="#1e293b"/>
    <text x="100" y="267" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace,Menlo,monospace" font-size="9">long-poll :8765</text>
  </g>

  <!-- agent B: zido (right) -->
  <g>
    <rect x="735" y="120" width="130" height="170" rx="14" fill="#0f172a" stroke="#f472b6" stroke-width="2"/>
    <circle cx="800" cy="165" r="26" fill="none" stroke="#f472b6" stroke-width="2"/>
    <text x="800" y="174" text-anchor="middle" fill="#f472b6" font-family="ui-monospace,Menlo,monospace" font-size="20">⚙️</text>
    <text x="800" y="220" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="bold">zido</text>
    <text x="800" y="240" text-anchor="middle" fill="#64748b" font-family="ui-monospace,Menlo,monospace" font-size="10">coding agent · vm-b</text>
    <rect x="755" y="252" width="90" height="22" rx="11" fill="#0b1020" stroke="#1e293b"/>
    <text x="800" y="267" text-anchor="middle" fill="#f472b6" font-family="ui-monospace,Menlo,monospace" font-size="9">long-poll :8765</text>
  </g>

  <!-- packet: task (hermes -> relay -> zido), blue pill -->
  <g font-family="ui-monospace,Menlo,monospace">
    <g>
      <rect x="0" y="0" width="74" height="24" rx="12" fill="#38bdf8" filter="url(#soft)" opacity="0.5"/>
      <rect x="0" y="0" width="74" height="24" rx="12" fill="#0ea5e9"/>
      <text x="37" y="16" text-anchor="middle" fill="#082f49" font-size="11" font-weight="bold">task ⬤</text>
      <animateMotion dur="3s" repeatCount="indefinite"
        path="M 150,160 C 240,165 300,190 385,200 L 545,200 C 630,190 690,165 780,160"/>
      <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.05;0.5;0.95;1" dur="3s" repeatCount="indefinite"/>
    </g>
    <!-- packet: result (zido -> relay -> hermes), pink pill -->
    <g>
      <rect x="0" y="0" width="74" height="24" rx="12" fill="#f472b6" filter="url(#soft)" opacity="0.5"/>
      <rect x="0" y="0" width="74" height="24" rx="12" fill="#ec4899"/>
      <text x="37" y="16" text-anchor="middle" fill="#500724" font-size="11" font-weight="bold">result ✓</text>
      <animateMotion dur="3s" begin="1.5s" repeatCount="indefinite"
        path="M 780,250 C 690,255 630,220 545,218 L 385,218 C 300,220 240,255 150,250"/>
      <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.05;0.5;0.95;1" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- labels -->
  <text x="255" y="140" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace,Menlo,monospace" font-size="11">send</text>
  <text x="255" y="290" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace,Menlo,monospace" font-size="11">result back</text>
  <text x="645" y="140" text-anchor="middle" fill="#f9a8d4" font-family="ui-monospace,Menlo,monospace" font-size="11">long-poll</text>
  <text x="645" y="290" text-anchor="middle" fill="#f9a8d4" font-family="ui-monospace,Menlo,monospace" font-size="11">ack + deliver</text>

  <!-- footer -->
  <text x="450" y="375" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,monospace" font-size="11">no shared filesystem · no shared runtime · no protocol negotiation</text>
  <text x="450" y="398" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,monospace" font-size="11">JSON over HTTP · HMAC-SHA256 · at-least-once delivery</text>
</svg>
